# NexaDoc-50k training configuration.
#
# The data is already split and already at the target resolution.  Override
# `data.root` with --data-root when the Kaggle mount differs.

data:
  root: "/kaggle/input/nexadoc-50k"
  num_workers: 2
  prefetch_factor: 2

stage1:
  # IOANet / MobileNetV2 at 256x256 (the corpus resolution).
  backbone: "mobilenet_v2"
  pretrained: true
  clamp_output: true
  epochs: 100
  batch_size: 24          # per GPU; 2xT4 -> effective 48
  val_batch_size: 32
  lr: 0.0002
  min_lr_ratio: 0.02
  weight_decay: 0.01
  warmup_epochs: 5
  amp: true
  grad_clip: 1.0
  ema_decay: 0.999
  l1_weight: 1.0
  mask_weight: 2.0
  lpips_weight: 0.1
  val_interval: 1
  save_interval: 5
  patience: 20
  seed: 42
  output_dir: "outputs/nexadoc/stage1"

stage2:
  # Residual U-Net: 256x256 -> 768x1024 (3x4 anisotropic).
  base_channels: 16        # 1.23M params; full-resolution U-Net is compute-bound
  clamp_output: true
  epochs: 40
  batch_size: 4           # per GPU; reduce to 2 if a T4 runs out of memory
  val_batch_size: 1
  lr: 0.0002
  min_lr_ratio: 0.02
  weight_decay: 0.01
  warmup_epochs: 3
  amp: true
  grad_clip: 1.0
  ema_decay: 0.999
  l1_weight: 1.0
  lpips_weight: 0.0       # pure L1 for best PSNR; 0.02 for perceptual sharpness
  val_interval: 1
  save_interval: 5
  patience: 10
  seed: 42
  output_dir: "outputs/nexadoc/stage2"
